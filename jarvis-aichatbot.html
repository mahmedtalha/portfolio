<!-- JARVIS is loaded as a fragment by jarvis-aichatbot.js. -->
<div id="jarvis-assistant">
  <button id="jarvis-launcher" type="button" aria-label="Open JARVIS AI Assistant"
    aria-controls="jarvis-chat-window" aria-expanded="false">
    <span class="jarvis-tooltip" role="tooltip">Ask JARVIS</span>
    <span class="jarvis-btn-core" aria-hidden="true">
      <span class="jarvis-ring"></span>
      <span class="jarvis-ring-2"></span>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 3h6M12 3v3M7 7h10a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-7a3 3 0 0 1 3-3Z"/>
        <path d="M8 12h.01M16 12h.01M8.5 16h7M4 11H2M22 11h-2"/>
      </svg>
      <span class="jarvis-pulse"></span>
    </span>
    <span class="jarvis-label">ASK JARVIS<span class="jarvis-question">?</span></span>
  </button>

  <section id="jarvis-chat-window" role="dialog" aria-modal="false" aria-labelledby="jarvis-dialog-title"
    aria-describedby="jarvis-dialog-subtitle" aria-hidden="true" hidden>
    <header id="jarvis-header">
      <div class="jarvis-header-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M9 3h6M12 3v3M7 7h10a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-7a3 3 0 0 1 3-3Z"/>
          <path d="M8 12h.01M16 12h.01M8.5 16h7"/>
        </svg>
      </div>
      <div class="jarvis-header-info">
        <h2 id="jarvis-dialog-title">JARVIS</h2>
        <p id="jarvis-dialog-subtitle">AI Portfolio Assistant</p>
        <span class="jarvis-online-badge"><span class="jarvis-online-dot"></span>Online</span>
      </div>
      <div class="jarvis-header-controls">
        <button id="jarvis-minimize-btn" class="jarvis-ctrl-btn" type="button" aria-label="Minimize JARVIS"
          title="Minimize"><i class="fas fa-minus" aria-hidden="true"></i></button>
        <button id="jarvis-close-btn" class="jarvis-ctrl-btn jarvis-close-btn" type="button"
          aria-label="Close JARVIS" title="Close"><i class="fas fa-times" aria-hidden="true"></i></button>
      </div>
    </header>

    <div id="jarvis-messages" role="log" aria-live="polite" aria-relevant="additions"></div>

    <div id="jarvis-input-area">
      <form id="jarvis-form" novalidate>
        <label class="jarvis-sr-only" for="jarvis-text-input">Ask JARVIS about Muhammad's portfolio</label>
        <div class="jarvis-input-row">
          <textarea id="jarvis-text-input" rows="1" maxlength="500"
            placeholder="Ask about skills, projects, experience..." autocomplete="off"></textarea>
          <button id="jarvis-send-btn" class="jarvis-input-btn" type="submit" aria-label="Send message"
            title="Send"><i class="fas fa-paper-plane" aria-hidden="true"></i></button>
        </div>
      </form>
      <div class="jarvis-input-footer">
        <span class="jarvis-footer-text">Portfolio knowledge • No API key exposed</span>
        <button id="jarvis-clear-btn" type="button">Clear chat</button>
      </div>
    </div>
  </section>
</div>
